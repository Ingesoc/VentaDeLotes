[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — todas las rutas retornan index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache de assets estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

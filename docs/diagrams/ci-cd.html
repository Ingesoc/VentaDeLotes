<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline de CI · La Holanda</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #FAFAF8;
      --color-ink:     #1B4332;
      --color-muted:   #2D6A4F;
      --color-accent:  #D4A373;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Playfair Display', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1000px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">CI/CD · La Holanda</p>
    <h1>Pipeline de integración continua</h1>

    <svg viewBox="0 0 960 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cicd-title cicd-desc">
      <title id="cicd-title">Pipeline de integración continua</title>
      <desc id="cicd-desc">Flujo del pipeline: cada push o pull request corre los jobs de calidad y de pruebas end-to-end; el pipeline queda verde o rojo según el resultado.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2D6A4F"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#D4A373"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FAFAF8"/>

      <!-- ===== FLECHAS (detrás) ===== -->
      <line x1="480" y1="128" x2="480" y2="176" stroke="#2D6A4F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="224" x2="480" y2="272" stroke="#2D6A4F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="320" x2="480" y2="368" stroke="#2D6A4F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="416" x2="480" y2="464" stroke="#2D6A4F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="512" x2="480" y2="560" stroke="#2D6A4F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Decision → verde (coral) -->
      <path d="M 480,648 V 660 Q 480,668 472,668 H 368 Q 360,668 360,660 V 688" fill="none" stroke="#D4A373" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Decision → rojo -->
      <path d="M 480,648 V 660 Q 480,668 488,668 H 592 Q 600,668 600,660 V 688" fill="none" stroke="#2D6A4F" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== ETIQUETAS ===== -->
      <rect x="372" y="644" width="80" height="12" rx="2" fill="#FAFAF8"/>
      <text x="412" y="654" fill="#D4A373" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TODO PASA</text>

      <rect x="508" y="644" width="80" height="12" rx="2" fill="#FAFAF8"/>
      <text x="548" y="654" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALGO FALLA</text>

      <!-- ===== INICIO (óvalo) ===== -->
      <rect x="400" y="80" width="160" height="48" rx="24" fill="#FAFAF8"/>
      <rect x="400" y="80" width="160" height="48" rx="24" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <text x="480" y="108" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Push o PR a main</text>

      <!-- Paso: Checkout -->
      <rect x="416" y="176" width="128" height="48" rx="6" fill="#FAFAF8"/>
      <rect x="416" y="176" width="128" height="48" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <text x="480" y="204" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Checkout</text>

      <!-- Paso: Setup Bun -->
      <rect x="416" y="272" width="128" height="48" rx="6" fill="#FAFAF8"/>
      <rect x="416" y="272" width="128" height="48" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <text x="480" y="292" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Setup Bun</text>
      <text x="480" y="308" fill="#2D6A4F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1.3.14</text>

      <!-- Paso: bun install -->
      <rect x="400" y="368" width="160" height="48" rx="6" fill="#FAFAF8"/>
      <rect x="400" y="368" width="160" height="48" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <text x="480" y="396" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">bun install</text>

      <!-- Paso: Job quality (focal) -->
      <rect x="368" y="464" width="224" height="48" rx="6" fill="#FAFAF8"/>
      <rect x="368" y="464" width="224" height="48" rx="6" fill="rgba(212,163,115,0.16)" stroke="#D4A373" stroke-width="1"/>
      <rect x="376" y="472" width="36" height="12" rx="2" fill="transparent" stroke="rgba(212,163,115,0.60)" stroke-width="0.8"/>
      <text x="394" y="481" fill="#A87C4A" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOB</text>
      <text x="480" y="484" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Quality</text>
      <text x="480" y="500" fill="#2D6A4F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">build · tests · doctor</text>

      <!-- Paso: Job e2e -->
      <rect x="408" y="560" width="144" height="48" rx="6" fill="#FAFAF8"/>
      <rect x="408" y="560" width="144" height="48" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <text x="480" y="580" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">E2E</text>
      <text x="480" y="596" fill="#2D6A4F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">playwright</text>

      <!-- Decisión -->
      <path d="M 480,616 L 528,648 L 480,680 L 432,648 Z" fill="#FAFAF8" stroke="#1B4332" stroke-width="1"/>
      <text x="480" y="652" fill="#1B4332" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Resultado</text>

      <!-- Fin: Verde (óvalo, focal) -->
      <rect x="288" y="688" width="144" height="48" rx="24" fill="#FAFAF8"/>
      <rect x="288" y="688" width="144" height="48" rx="24" fill="rgba(212,163,115,0.16)" stroke="#D4A373" stroke-width="1"/>
      <text x="360" y="716" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Pipeline verde</text>

      <!-- Fin: Rojo -->
      <rect x="528" y="688" width="144" height="48" rx="24" fill="#FAFAF8"/>
      <rect x="528" y="688" width="144" height="48" rx="24" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <text x="600" y="716" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Pipeline rojo</text>

      <!-- ===== LEYENDA ===== -->
      <line x1="40" y1="744" x2="920" y2="744" stroke="rgba(27,67,50,0.10)" stroke-width="0.8"/>
      <text x="40" y="760" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>

      <line x1="40" y1="756" x2="68" y2="756" stroke="#2D6A4F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="76" y="760" fill="#2D6A4F" font-size="8.5" font-family="'Inter', sans-serif">Flujo</text>

      <line x1="160" y1="756" x2="188" y2="756" stroke="#D4A373" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="196" y="760" fill="#2D6A4F" font-size="8.5" font-family="'Inter', sans-serif">Camino de éxito</text>
    </svg>
  </div>
</body>
</html>

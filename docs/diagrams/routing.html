<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Árbol de rutas · La Holanda</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #FAFAF8;
      --color-ink:     #1B4332;
      --color-muted:   #2D6A4F;
      --color-accent:  #D4A373;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Playfair Display', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Routing · La Holanda</p>
    <h1>Árbol de rutas de la aplicación</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="routing-title routing-desc">
      <title id="routing-title">Árbol de rutas de la aplicación</title>
      <desc id="routing-desc">Árbol de rutas: las páginas públicas cuelgan de RootLayout y el panel de administración se carga con lazy y se protege con AdminGuard.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2D6A4F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FAFAF8"/>

      <!-- ===== CONECTORES (detrás) ===== -->
      <!-- Root → bus nivel 1 -->
      <line x1="640" y1="112" x2="640" y2="148" stroke="#2D6A4F" stroke-width="1"/>
      <line x1="520" y1="148" x2="1142" y2="148" stroke="#2D6A4F" stroke-width="1"/>
      <line x1="520" y1="148" x2="520" y2="180" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="1142" y1="148" x2="1142" y2="180" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Públicas → bus nivel 2 -->
      <line x1="520" y1="224" x2="520" y2="272" stroke="#2D6A4F" stroke-width="1"/>
      <line x1="108" y1="272" x2="952" y2="272" stroke="#2D6A4F" stroke-width="1"/>
      <!-- drops a cada hoja pública -->
      <line x1="104" y1="272" x2="104" y2="300" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="224" y1="272" x2="224" y2="300" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="344" y1="272" x2="344" y2="300" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="464" y1="272" x2="464" y2="300" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="584" y1="272" x2="584" y2="300" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="704" y1="272" x2="704" y2="300" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="824" y1="272" x2="824" y2="300" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="944" y1="272" x2="944" y2="300" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Admin → bus nivel 2 -->
      <line x1="1142" y1="224" x2="1142" y2="272" stroke="#2D6A4F" stroke-width="1"/>
      <line x1="1080" y1="272" x2="1204" y2="272" stroke="#2D6A4F" stroke-width="1"/>
      <line x1="1080" y1="272" x2="1080" y2="300" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="1204" y1="272" x2="1204" y2="300" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- AdminGuard → bus nivel 3 -->
      <line x1="1204" y1="348" x2="1204" y2="396" stroke="#2D6A4F" stroke-width="1"/>
      <line x1="1096" y1="396" x2="1224" y2="396" stroke="#2D6A4F" stroke-width="1"/>
      <line x1="1096" y1="396" x2="1096" y2="424" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="1224" y1="396" x2="1224" y2="424" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- ===== RAÍZ ===== -->
      <rect x="560" y="64" width="160" height="48" rx="6" fill="#FAFAF8"/>
      <rect x="560" y="64" width="160" height="48" rx="6" fill="rgba(212,163,115,0.16)" stroke="#D4A373" stroke-width="1"/>
      <rect x="568" y="72" width="20" height="12" rx="2" fill="transparent" stroke="rgba(212,163,115,0.60)" stroke-width="0.8"/>
      <text x="578" y="81" fill="#A87C4A" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">/</text>
      <text x="640" y="92" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">RootLayout</text>
      <text x="640" y="106" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/</text>

      <!-- ===== CONTENEDOR: Rutas públicas ===== -->
      <rect x="40" y="180" width="960" height="184" rx="8" fill="rgba(27,67,50,0.02)" stroke="rgba(27,67,50,0.10)" stroke-width="0.8"/>
      <rect x="440" y="184" width="160" height="12" rx="2" fill="#FAFAF8"/>
      <text x="520" y="193" fill="rgba(27,67,50,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RUTAS PÚBLICAS</text>

      <!-- Hojas públicas -->
      <rect x="48" y="300" width="112" height="32" rx="6" fill="#FAFAF8"/>
      <rect x="48" y="300" width="112" height="32" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <text x="104" y="320" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Home</text>

      <rect x="168" y="300" width="112" height="32" rx="6" fill="#FAFAF8"/>
      <rect x="168" y="300" width="112" height="32" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <text x="224" y="320" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Inversión</text>

      <rect x="288" y="300" width="112" height="32" rx="6" fill="#FAFAF8"/>
      <rect x="288" y="300" width="112" height="32" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <text x="344" y="320" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Lotes</text>

      <rect x="408" y="300" width="112" height="32" rx="6" fill="#FAFAF8"/>
      <rect x="408" y="300" width="112" height="32" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <text x="464" y="320" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Detalle lote</text>

      <rect x="528" y="300" width="112" height="32" rx="6" fill="#FAFAF8"/>
      <rect x="528" y="300" width="112" height="32" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <text x="584" y="320" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Quindío</text>

      <rect x="648" y="300" width="112" height="32" rx="6" fill="#FAFAF8"/>
      <rect x="648" y="300" width="112" height="32" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <text x="704" y="320" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Contacto</text>

      <rect x="768" y="300" width="112" height="32" rx="6" fill="#FAFAF8"/>
      <rect x="768" y="300" width="112" height="32" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <text x="824" y="320" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Guardados</text>

      <rect x="888" y="300" width="112" height="32" rx="6" fill="#FAFAF8"/>
      <rect x="888" y="300" width="112" height="32" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <text x="944" y="320" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Restablecer</text>

      <!-- Rutas en subetiqueta -->
      <text x="104" y="344" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/</text>
      <text x="224" y="344" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/investment</text>
      <text x="344" y="344" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/projects</text>
      <text x="464" y="344" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/projects/:id</text>
      <text x="584" y="344" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/descubre-quindio</text>
      <text x="704" y="344" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/contact</text>
      <text x="824" y="344" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/saved</text>
      <text x="944" y="344" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/reset-password</text>

      <!-- ===== CONTENEDOR: Panel admin ===== -->
      <rect x="1020" y="180" width="244" height="312" rx="8" fill="rgba(27,67,50,0.02)" stroke="rgba(27,67,50,0.10)" stroke-width="0.8"/>
      <rect x="1076" y="184" width="128" height="12" rx="2" fill="#FAFAF8"/>
      <text x="1140" y="193" fill="rgba(27,67,50,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PANEL ADMIN</text>

      <rect x="1024" y="300" width="112" height="32" rx="6" fill="#FAFAF8"/>
      <rect x="1024" y="300" width="112" height="32" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="1080" y="320" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Login</text>
      <text x="1080" y="344" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/admin/login</text>

      <rect x="1148" y="300" width="112" height="32" rx="6" fill="#FAFAF8"/>
      <rect x="1148" y="300" width="112" height="32" rx="6" fill="rgba(212,163,115,0.05)" stroke="rgba(212,163,115,0.60)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="1204" y="320" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">AdminGuard</text>
      <text x="1204" y="344" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/admin · lazy</text>

      <!-- Hijos de AdminGuard -->
      <rect x="1044" y="424" width="104" height="32" rx="6" fill="#FAFAF8"/>
      <rect x="1044" y="424" width="104" height="32" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <text x="1096" y="444" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Dashboard</text>

      <rect x="1160" y="424" width="104" height="32" rx="6" fill="#FAFAF8"/>
      <rect x="1160" y="424" width="104" height="32" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <text x="1212" y="444" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Lotes</text>

      <text x="1096" y="468" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/admin/dashboard</text>
      <text x="1212" y="468" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/admin/lots</text>

      <!-- ===== LEYENDA ===== -->
      <line x1="40" y1="640" x2="1240" y2="640" stroke="rgba(27,67,50,0.10)" stroke-width="0.8"/>
      <text x="40" y="656" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>

      <rect x="40" y="660" width="14" height="10" rx="2" fill="rgba(212,163,115,0.16)" stroke="#D4A373" stroke-width="1"/>
      <text x="60" y="668" fill="#2D6A4F" font-size="8.5" font-family="'Inter', sans-serif">Raíz</text>

      <rect x="140" y="660" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <text x="160" y="668" fill="#2D6A4F" font-size="8.5" font-family="'Inter', sans-serif">Página</text>

      <rect x="260" y="660" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#1B4332" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="280" y="668" fill="#2D6A4F" font-size="8.5" font-family="'Inter', sans-serif">Carga perezosa (lazy)</text>

      <rect x="460" y="660" width="14" height="10" rx="2" fill="rgba(212,163,115,0.05)" stroke="rgba(212,163,115,0.60)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="480" y="668" fill="#2D6A4F" font-size="8.5" font-family="'Inter', sans-serif">Protegida (AdminGuard)</text>
    </svg>
  </div>
</body>
</html>

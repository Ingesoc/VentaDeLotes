<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de administración · La Holanda</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #FAFAF8;
      --color-ink:     #1B4332;
      --color-muted:   #2D6A4F;
      --color-accent:  #D4A373;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Playfair Display', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Panel de administración · La Holanda</p>
    <h1>Estructura del panel de administración</h1>

    <svg viewBox="0 0 1280 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="admin-title admin-desc">
      <title id="admin-title">Estructura del panel de administración</title>
      <desc id="admin-desc">Panel de administración: AdminGuard protege las rutas y AdminLayout las organiza; las páginas de login, dashboard y gestión de lotes se conectan con Supabase y Cloudinary.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2D6A4F"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#D4A373"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FAFAF8"/>

      <!-- ===== CONECTORES (detrás) ===== -->
      <!-- AdminGuard → AdminLayout -->
      <line x1="640" y1="136" x2="640" y2="160" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- AdminLayout → bus → páginas -->
      <line x1="640" y1="232" x2="640" y2="264" stroke="#2D6A4F" stroke-width="1"/>
      <line x1="520" y1="264" x2="980" y2="264" stroke="#2D6A4F" stroke-width="1"/>
      <line x1="520" y1="264" x2="520" y2="280" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="980" y1="264" x2="980" y2="280" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Páginas → servicios -->
      <line x1="220" y1="160" x2="220" y2="500" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="520" y1="456" x2="520" y2="500" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 800,456 V 480 H 640 V 500" fill="none" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="1040" y1="456" x2="1040" y2="500" stroke="#2D6A4F" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Etiquetas de conectores -->
      <rect x="228" y="196" width="48" height="12" rx="2" fill="#FAFAF8"/>
      <text x="252" y="206" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">login</text>

      <rect x="1048" y="472" width="64" height="12" rx="2" fill="#FAFAF8"/>
      <text x="1080" y="482" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">imágenes</text>

      <rect x="660" y="472" width="44" height="12" rx="2" fill="#FAFAF8"/>
      <text x="682" y="482" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">datos</text>

      <!-- ===== LoginPage (pública) ===== -->
      <rect x="80" y="64" width="280" height="96" rx="6" fill="#FAFAF8"/>
      <rect x="80" y="64" width="280" height="96" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="88" y="72" width="24" height="12" rx="2" fill="transparent" stroke="rgba(27,67,50,0.40)" stroke-width="0.8"/>
      <text x="100" y="81" fill="#1B4332" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PÚB</text>
      <text x="220" y="92" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">LoginPage</text>
      <line x1="88" y1="100" x2="352" y2="100" stroke="rgba(27,67,50,0.12)" stroke-width="0.8"/>
      <text x="92" y="116" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">email y contraseña</text>
      <text x="92" y="132" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">resetPasswordForEmail()</text>
      <text x="92" y="148" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace">/admin/login</text>

      <!-- ===== AdminGuard (focal) ===== -->
      <rect x="500" y="64" width="280" height="72" rx="6" fill="#FAFAF8"/>
      <rect x="500" y="64" width="280" height="72" rx="6" fill="rgba(212,163,115,0.16)" stroke="#D4A373" stroke-width="1"/>
      <rect x="508" y="72" width="36" height="12" rx="2" fill="transparent" stroke="rgba(212,163,115,0.60)" stroke-width="0.8"/>
      <text x="526" y="81" fill="#A87C4A" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GUARD</text>
      <text x="640" y="92" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">AdminGuard</text>
      <line x1="508" y1="100" x2="772" y2="100" stroke="rgba(212,163,115,0.50)" stroke-width="0.8"/>
      <text x="512" y="116" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">sesión activa</text>
      <text x="512" y="132" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">has_backstage_access()</text>

      <!-- ===== AdminLayout ===== -->
      <rect x="500" y="160" width="280" height="72" rx="6" fill="#FAFAF8"/>
      <rect x="500" y="160" width="280" height="72" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <rect x="508" y="168" width="44" height="12" rx="2" fill="transparent" stroke="rgba(27,67,50,0.40)" stroke-width="0.8"/>
      <text x="530" y="177" fill="#1B4332" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LAYOUT</text>
      <text x="640" y="188" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">AdminLayout</text>
      <line x1="508" y1="196" x2="772" y2="196" stroke="rgba(27,67,50,0.12)" stroke-width="0.8"/>
      <text x="512" y="212" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">sidebar oscuro · header</text>
      <text x="512" y="228" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">botón de logout</text>

      <!-- ===== DashboardPage ===== -->
      <rect x="360" y="280" width="320" height="176" rx="6" fill="#FAFAF8"/>
      <rect x="360" y="280" width="320" height="176" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <rect x="368" y="288" width="24" height="12" rx="2" fill="transparent" stroke="rgba(27,67,50,0.40)" stroke-width="0.8"/>
      <text x="380" y="297" fill="#1B4332" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PÁG</text>
      <text x="520" y="308" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">DashboardPage</text>
      <line x1="368" y1="316" x2="672" y2="316" stroke="rgba(27,67,50,0.12)" stroke-width="0.8"/>
      <text x="372" y="332" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">tarjetas con métricas</text>
      <text x="372" y="348" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">barras · visitas 14 días</text>
      <text x="372" y="364" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">línea · leads 14 días</text>
      <text x="372" y="380" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">torta · lotes por estado</text>
      <text x="372" y="396" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">listas más visitados y leads</text>
      <text x="372" y="412" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace">/admin/dashboard</text>

      <!-- ===== LotsPage ===== -->
      <rect x="760" y="280" width="440" height="176" rx="6" fill="#FAFAF8"/>
      <rect x="760" y="280" width="440" height="176" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <rect x="768" y="288" width="24" height="12" rx="2" fill="transparent" stroke="rgba(27,67,50,0.40)" stroke-width="0.8"/>
      <text x="780" y="297" fill="#1B4332" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PÁG</text>
      <text x="980" y="308" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">LotsPage</text>
      <line x1="768" y1="316" x2="1192" y2="316" stroke="rgba(27,67,50,0.12)" stroke-width="0.8"/>
      <text x="772" y="332" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">LotsTable · tabla editable</text>
      <text x="772" y="348" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">useLots · crear, editar, eliminar</text>
      <text x="772" y="364" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">LotsHeader · búsqueda y crear</text>
      <text x="772" y="380" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">estados: disponible, reservado, vendido</text>
      <text x="772" y="396" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">Cloudinary · imagen aérea</text>
      <text x="772" y="412" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace">/admin/lots</text>

      <!-- ===== Supabase ===== -->
      <rect x="80" y="500" width="720" height="96" rx="6" fill="#FAFAF8"/>
      <rect x="80" y="500" width="720" height="96" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <rect x="88" y="508" width="24" height="12" rx="2" fill="transparent" stroke="rgba(27,67,50,0.40)" stroke-width="0.8"/>
      <text x="100" y="517" fill="#1B4332" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="440" y="528" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Supabase</text>
      <line x1="88" y1="536" x2="792" y2="536" stroke="rgba(27,67,50,0.12)" stroke-width="0.8"/>
      <text x="92" y="552" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">Auth · signInWithPassword()</text>
      <text x="92" y="568" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">tablas · lots, leads, page_views</text>
      <text x="92" y="584" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">RPC · RLS · políticas por rol</text>

      <!-- ===== Cloudinary ===== -->
      <rect x="880" y="500" width="320" height="96" rx="6" fill="#FAFAF8"/>
      <rect x="880" y="500" width="320" height="96" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <rect x="888" y="508" width="24" height="12" rx="2" fill="transparent" stroke="rgba(27,67,50,0.40)" stroke-width="0.8"/>
      <text x="900" y="517" fill="#1B4332" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CDN</text>
      <text x="1040" y="528" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Cloudinary</text>
      <line x1="888" y1="536" x2="1192" y2="536" stroke="rgba(27,67,50,0.12)" stroke-width="0.8"/>
      <text x="892" y="552" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">widget de subida</text>
      <text x="892" y="568" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">imágenes aéreas de lotes</text>

      <!-- ===== Estados de UI ===== -->
      <rect x="440" y="644" width="400" height="104" rx="6" fill="#FAFAF8"/>
      <rect x="440" y="644" width="400" height="104" rx="6" fill="rgba(212,163,115,0.05)" stroke="rgba(212,163,115,0.60)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="448" y="652" width="20" height="12" rx="2" fill="transparent" stroke="rgba(212,163,115,0.60)" stroke-width="0.8"/>
      <text x="458" y="661" fill="#A87C4A" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="640" y="672" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Estados de UI</text>
      <line x1="448" y1="680" x2="832" y2="680" stroke="rgba(212,163,115,0.40)" stroke-width="0.8"/>
      <text x="452" y="696" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">loading · spinner inicial</text>
      <text x="452" y="712" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">saving · persistir cambios</text>
      <text x="452" y="728" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">uploading · subir imagen</text>
      <text x="452" y="744" fill="#1B4332" font-size="9" font-family="'Geist Mono', monospace">error · mensaje visible</text>

      <!-- ===== LEYENDA ===== -->
      <line x1="40" y1="776" x2="1240" y2="776" stroke="rgba(27,67,50,0.10)" stroke-width="0.8"/>
      <text x="40" y="792" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>

      <line x1="40" y1="796" x2="68" y2="796" stroke="#2D6A4F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="76" y="800" fill="#2D6A4F" font-size="8.5" font-family="'Inter', sans-serif">Flujo de datos</text>

      <rect x="180" y="792" width="14" height="10" rx="2" fill="rgba(212,163,115,0.16)" stroke="#D4A373" stroke-width="1"/>
      <text x="200" y="800" fill="#2D6A4F" font-size="8.5" font-family="'Inter', sans-serif">Protección (AdminGuard)</text>

      <rect x="380" y="792" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <text x="400" y="800" fill="#2D6A4F" font-size="8.5" font-family="'Inter', sans-serif">Página protegida</text>

      <rect x="540" y="792" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#1B4332" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="560" y="800" fill="#2D6A4F" font-size="8.5" font-family="'Inter', sans-serif">Página pública</text>

      <rect x="680" y="792" width="14" height="10" rx="2" fill="rgba(212,163,115,0.05)" stroke="rgba(212,163,115,0.60)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="700" y="800" fill="#2D6A4F" font-size="8.5" font-family="'Inter', sans-serif">Estados de UI</text>
    </svg>
  </div>
</body>
</html>

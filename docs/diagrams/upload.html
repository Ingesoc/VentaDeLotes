<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subida de imágenes · La Holanda</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #FAFAF8;
      --color-ink:     #1B4332;
      --color-muted:   #2D6A4F;
      --color-accent:  #D4A373;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Playfair Display', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1000px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Medios · La Holanda</p>
    <h1>Subida de imágenes desde el panel admin</h1>

    <svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="upload-title upload-desc">
      <title id="upload-title">Subida de imágenes desde el panel admin</title>
      <desc id="upload-desc">El administrador sube una imagen con el widget de Cloudinary; al recibir la url, la página de lotes guarda la referencia en Supabase.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2D6A4F"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#D4A373"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#2D6A4F" stroke-width="1.2"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#FAFAF8"/>

      <!-- ===== LÍNEAS DE VIDA ===== -->
      <line x1="160" y1="128" x2="160" y2="620" stroke="rgba(27,67,50,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="360" y1="128" x2="360" y2="620" stroke="rgba(27,67,50,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="580" y1="128" x2="580" y2="620" stroke="rgba(27,67,50,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="128" x2="800" y2="620" stroke="rgba(27,67,50,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ===== BARRAS DE ACTIVACIÓN ===== -->
      <!-- LotsPage: recibe en 176 y confirma en 460 -->
      <rect x="356" y="176" width="8" height="284" fill="rgba(27,67,50,0.06)" stroke="#2D6A4F" stroke-width="0.8"/>
      <!-- Widget: llamado en 224, responde en 356 -->
      <rect x="576" y="224" width="8" height="132" fill="rgba(27,67,50,0.06)" stroke="#2D6A4F" stroke-width="0.8"/>

      <!-- ===== MENSAJES ===== -->
      <!-- M1: Admin → LotsPage -->
      <line x1="160" y1="176" x2="360" y2="176" stroke="#2D6A4F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M2: LotsPage → Widget -->
      <line x1="360" y1="224" x2="580" y2="224" stroke="#2D6A4F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M3: Widget → Admin (selector, async) -->
      <line x1="580" y1="272" x2="160" y2="272" stroke="#2D6A4F" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <!-- M4: Admin → Widget -->
      <line x1="160" y1="320" x2="580" y2="320" stroke="#2D6A4F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M5: Widget → Widget (sube) -->
      <path d="M 588 368 L 632 368 L 632 400 L 588 400" fill="none" stroke="#2D6A4F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M6: Widget → LotsPage (secure_url) -->
      <line x1="580" y1="448" x2="360" y2="448" stroke="#2D6A4F" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- ===== FRAGMENTO ALT ===== -->
      <rect x="348" y="492" width="464" height="128" rx="4" fill="rgba(27,67,50,0.02)" stroke="rgba(27,67,50,0.22)" stroke-width="1"/>
      <rect x="348" y="492" width="40" height="16" rx="2" fill="#FAFAF8" stroke="rgba(27,67,50,0.22)" stroke-width="1"/>
      <text x="368" y="504" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <!-- Guard región 1 -->
      <text x="360" y="520" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[URL recibida]</text>
      <!-- LotsPage → Supabase -->
      <line x1="360" y1="548" x2="800" y2="548" stroke="#2D6A4F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Supabase → LotsPage (confirmación, coral) -->
      <line x1="800" y1="580" x2="360" y2="580" stroke="#D4A373" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

      <!-- ===== ETIQUETAS ===== -->
      <rect x="196" y="160" width="128" height="12" rx="2" fill="#FAFAF8"/>
      <text x="260" y="170" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLIC EN SUBIR IMAGEN</text>

      <rect x="404" y="208" width="132" height="12" rx="2" fill="#FAFAF8"/>
      <text x="470" y="218" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPLOADIMAGE()</text>

      <rect x="276" y="256" width="112" height="12" rx="2" fill="#FAFAF8"/>
      <text x="332" y="266" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ABRE SELECTOR</text>

      <rect x="276" y="304" width="128" height="12" rx="2" fill="#FAFAF8"/>
      <text x="340" y="314" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SELECCIONA IMAGEN</text>

      <rect x="640" y="376" width="92" height="12" rx="2" fill="#FAFAF8"/>
      <text x="686" y="386" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUBE A CDN</text>

      <rect x="416" y="432" width="92" height="12" rx="2" fill="#FAFAF8"/>
      <text x="462" y="442" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SECURE_URL</text>

      <rect x="504" y="532" width="152" height="12" rx="2" fill="#FAFAF8"/>
      <text x="580" y="542" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACTUALIZA AERIAL_IMAGE</text>

      <rect x="516" y="564" width="128" height="12" rx="2" fill="#FAFAF8"/>
      <text x="580" y="574" fill="#D4A373" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONFIRMACIÓN</text>

      <!-- ===== ACTORES ===== -->
      <!-- Administrador (input) -->
      <rect x="100" y="72" width="120" height="56" rx="6" fill="#FAFAF8"/>
      <rect x="100" y="72" width="120" height="56" rx="6" fill="rgba(45,106,79,0.10)" stroke="#6E7F71" stroke-width="1"/>
      <rect x="108" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(110,127,113,0.40)" stroke-width="0.8"/>
      <text x="122" y="89" fill="#6E7F71" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="160" y="104" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Administrador</text>
      <text x="160" y="119" fill="#2D6A4F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">panel admin</text>

      <!-- LotsPage (backend) -->
      <rect x="300" y="72" width="120" height="56" rx="6" fill="#FAFAF8"/>
      <rect x="300" y="72" width="120" height="56" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="1"/>
      <rect x="308" y="80" width="20" height="12" rx="2" fill="transparent" stroke="rgba(27,67,50,0.40)" stroke-width="0.8"/>
      <text x="318" y="89" fill="#1B4332" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="360" y="104" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">LotsPage</text>
      <text x="360" y="119" fill="#2D6A4F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CRUD de lotes</text>

      <!-- Widget Cloudinary (externo) -->
      <rect x="520" y="72" width="120" height="56" rx="6" fill="#FAFAF8"/>
      <rect x="520" y="72" width="120" height="56" rx="6" fill="rgba(27,67,50,0.03)" stroke="rgba(27,67,50,0.30)" stroke-width="1"/>
      <rect x="528" y="80" width="24" height="12" rx="2" fill="transparent" stroke="rgba(27,67,50,0.30)" stroke-width="0.8"/>
      <text x="540" y="89" fill="#6E7F71" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CDN</text>
      <text x="580" y="104" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Widget Cloudinary</text>
      <text x="580" y="119" fill="#2D6A4F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sube la imagen</text>

      <!-- Supabase (store) -->
      <rect x="740" y="72" width="120" height="56" rx="6" fill="#FAFAF8"/>
      <rect x="740" y="72" width="120" height="56" rx="6" fill="rgba(27,67,50,0.05)" stroke="#2D6A4F" stroke-width="1"/>
      <rect x="748" y="80" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,106,79,0.50)" stroke-width="0.8"/>
      <text x="758" y="89" fill="#2D6A4F" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="800" y="104" fill="#1B4332" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Supabase</text>
      <text x="800" y="119" fill="#2D6A4F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tabla lots</text>

      <!-- ===== LEYENDA ===== -->
      <line x1="100" y1="640" x2="860" y2="640" stroke="rgba(27,67,50,0.10)" stroke-width="0.8"/>
      <text x="100" y="656" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>

      <line x1="100" y1="644" x2="132" y2="644" stroke="#2D6A4F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="140" y="648" fill="#2D6A4F" font-size="8.5" font-family="'Inter', sans-serif">Llamada</text>

      <line x1="240" y1="644" x2="272" y2="644" stroke="#2D6A4F" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="280" y="648" fill="#2D6A4F" font-size="8.5" font-family="'Inter', sans-serif">Respuesta</text>

      <line x1="400" y1="644" x2="432" y2="644" stroke="#2D6A4F" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <text x="440" y="648" fill="#2D6A4F" font-size="8.5" font-family="'Inter', sans-serif">Asíncrono</text>

      <line x1="560" y1="644" x2="592" y2="644" stroke="#D4A373" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="600" y="648" fill="#2D6A4F" font-size="8.5" font-family="'Inter', sans-serif">Camino de éxito</text>
    </svg>
  </div>
</body>
</html>

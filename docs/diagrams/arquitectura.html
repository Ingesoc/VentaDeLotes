<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitectura del sistema · La Holanda</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #FAFAF8;
      --color-ink:     #1B4332;
      --color-muted:   #2D6A4F;
      --color-accent:  #D4A373;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Playfair Display', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitectura · La Holanda</p>
    <h1>Arquitectura del sistema</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arquitectura-title arquitectura-desc">
      <title id="arquitectura-title">Arquitectura del sistema</title>
      <desc id="arquitectura-desc">Arquitectura de La Holanda: la aplicación React en el navegador, la lógica compartida y los servicios en la nube (Supabase, Cloudinary y Google Fonts).</desc>

      </defs>

      <rect width="100%" height="100%" fill="#FAFAF8"/>

      <!-- ===== ZONAS ===== -->

      <rect x="252" y="100" width="136" height="12" rx="2" fill="#FAFAF8"/>
      <text x="320" y="109" fill="rgba(27,67,50,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NAVEGADOR</text>

      <rect x="684" y="100" width="152" height="12" rx="2" fill="#FAFAF8"/>
      <text x="760" y="109" fill="rgba(27,67,50,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LÓGICA COMPARTIDA</text>

      <rect x="580" y="452" width="120" height="12" rx="2" fill="#FAFAF8"/>
      <text x="640" y="461" fill="rgba(27,67,50,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SERVICIOS CLOUD</text>

      <text x="110" y="306" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUTH+DATOS</text>

      <rect x="112" y="356" width="52" height="12" rx="2" fill="#FAFAF8"/>
      <text x="138" y="366" fill="#2D6A4F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IMÁGENES</text>

      <rect x="128" y="416" width="48" height="12" rx="2" fill="#FAFAF8"/>

name: Keep Supabase Alive

# Evita que el proyecto free de Supabase se pause tras 7 días de inactividad.
# La pausa se calcula por requests entrantes a la API, así que un job interno
# de pg_cron NO sirve: hace falta una llamada externa. Este workflow corre a
# diario y hace una consulta real a la base de datos.
#
# Nota: GitHub desactiva los cron si el repositorio pasa 60 días sin actividad
# (push/PR). Si el repo se deja de tocar, usa un monitor externo gratuito
# (cron-job.org / UptimeRobot) apuntando a:
#   ${{ secrets.VITE_SUPABASE_URL }}/auth/v1/health
#
# Secrets requeridos (Settings > Secrets and variables > Actions):
#   VITE_SUPABASE_URL      (https://<ref>.supabase.co)
#   VITE_SUPABASE_ANON_KEY (la misma anon key pública del frontend)

on:
  schedule:
    # Todos los días a las 09:00 UTC
    - cron: "0 9 * * *"
  # Permite lanzarlo a mano desde la pestaña Actions para probar sin esperar
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta diaria a Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -e

          # 1) Health check: responde 200 sin credenciales y cuenta como actividad.
          HEALTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            "$SUPABASE_URL/auth/v1/health" || echo "000")
          echo "auth/v1/health -> $HEALTH_CODE"

          # 2) Consulta real a la base de datos (PostgREST) con la anon key.
          #    Incluso un 401/403 cuenta como actividad; solo importa que la
          #    petición llegue al gateway.
          LOTS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/lots?select=id&limit=1" || echo "000")
          echo "rest/v1/lots?select=id&limit=1 -> $LOTS_CODE"

          # Se falla solo si NO hubo respuesta HTTP (URL mal configurada o sin
          # secret), no por un 4xx que igual mantiene el proyecto activo.
          if [ "$HEALTH_CODE" = "000" ] && [ "$LOTS_CODE" = "000" ]; then
            echo "::error::No se pudo contactar Supabase. Verifica el secret VITE_SUPABASE_URL."
            exit 1
          fi

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || '' }}

      - name: Unit Tests
        run: bun run test:run

      - name: React Doctor
        run: npx react-doctor@latest --verbose

      - name: Security Audit
        run: npm audit --audit-level=critical

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-bun-e2e-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || '' }}

      - name: E2E Tests (Chromium)
        run: |
          # Start preview server in background
          bun run preview &
          PREVIEW_PID=$!
          trap "kill $PREVIEW_PID 2>/dev/null" EXIT

          # Wait for server using curl (wait-on nativo sin dependencias)
          echo "Waiting for preview server at http://localhost:4173..."
          SERVER_READY=false
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:4173; then
              SERVER_READY=true
              echo "✔ Server ready after ${i}s"
              break
            fi
            sleep 1
          done
          if [ "$SERVER_READY" = false ]; then
            echo "⚠ Server did not start within 60s — tests will likely fail"
          fi

          # Run tests (reuseExistingServer: true, no intenta iniciar otro)
          npx playwright test --project=chromium-mobile --project=chromium-desktop

      - name: Upload E2E Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: reports/e2e-report/
          retention-days: 7
